name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: composer audit --locked --no-interaction

  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable
      - run: composer check
      - run: composer audit --locked --no-interaction

  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer cs:install
      - run: composer cs

  live-verifier:
    # Runs tools/live-check.php against the pinned Commission verifier image.
    # It covers every HTTP path short of a wallet submission.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: docker compose -f docker/docker-compose.yaml up -d
      - name: Wait for the verifier
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ui/presentations/probe || true)
            if [ "$code" != "000" ]; then echo "verifier answered $code after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "verifier did not start"; docker compose -f docker/docker-compose.yaml logs; exit 1
      - run: composer live-check
      - if: always()
        run: docker compose -f docker/docker-compose.yaml down
